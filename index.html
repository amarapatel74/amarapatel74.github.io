<h1 id="architecture-over-intelligence">Architecture Over Intelligence</h1>
<div class="subtitle">How I made AI workflows reliable, even on a small model</div>
<div class="author">Amar Patel · The AI Fellowship Madrid · 9 October 2026</div>
<div class="lead-motif"><span class="a"></span><span class="b"></span><span class="c"></span></div>
<footer>Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="2" data-paginate="true" data-footer="Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026" data-lang="en" data-theme="rzs6u4qwbvrcz50lxlfc6ejpu70ckybviel8vb74wwxo" lang="en" data-marpit-pagination="2" style="--paginate:true;--footer:Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026;--lang:en;--theme:rzs6u4qwbvrcz50lxlfc6ejpu70ckybviel8vb74wwxo;" data-marpit-pagination-total="16">
<div class="kicker">A game</div>
<h1 id="make-one-button-blue-nothing-else">Make one button blue. <em>Nothing else.</em></h1>
<div class="body">
<div class="cols" style="grid-template-columns: 1.3fr 1fr; align-items:center; gap:40px">
<div class="spiral">
  <svg viewBox="0 0 560 330" aria-hidden="true">
    <defs><marker id="spiral-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#D7372B" /></marker></defs>
    <ellipse cx="280" cy="165" rx="220" ry="120" fill="none" stroke="#D7372B" stroke-width="2" stroke-dasharray="6 6" opacity="0.55" />
    <path d="M280 45 A220 120 0 0 1 409.4 67.9" fill="none" stroke="transparent" marker-end="url(#spiral-arr)" />
    <path d="M489.2 127.9 A220 120 0 0 1 489.2 202.1" fill="none" stroke="transparent" marker-end="url(#spiral-arr)" />
    <path d="M409.4 262.1 A220 120 0 0 1 280 285" fill="none" stroke="transparent" marker-end="url(#spiral-arr)" />
    <path d="M150.6 262.1 A220 120 0 0 1 70.8 202.1" fill="none" stroke="transparent" marker-end="url(#spiral-arr)" />
    <path d="M70.8 127.9 A220 120 0 0 1 150.6 67.9" fill="none" stroke="transparent" marker-end="url(#spiral-arr)" />
  </svg>
  <div class="c" style="left:280px;top:45px">edits the shared colour</div>
  <div class="c" style="left:489px;top:128px">“Done. One value, one file.”</div>
  <div class="c" style="left:409px;top:262px">you: “Half the site is blue”</div>
  <div class="c" style="left:151px;top:262px">23 agents trace the colour</div>
  <div class="c" style="left:71px;top:128px">a new colour…</div>
  <div class="hub"><span class="btn">Add to Cart</span><span class="btn">Cancel</span><span class="sw"><i style="background:#2563eb"></i><i style="background:#0d9488"></i><i style="background:#7c3aed"></i><i style="background:#ea580c"></i></span>both, every round</div>
</div>
<div>
<div class="spiral-task">Task: make Add to Cart blue <i></i></div>
<p style="font-size:0.8em;margin-top:18px">Opusfived, a parody by Milos Novovic: <b>opusfived.dev</b></p>
<p style="font-size:0.74em;color:var(--muted)">It changes both buttons and says “Done”.<br />Every round of clean-up is paid for.</p>
<p><span class="coin">€</span> <span class="coin">€</span> <span class="coin">€</span></p>
</div>
</div>
</div>
<div class="inshort"><b>In short</b> A clever AI can do more than you asked, call it done, and bill you for the clean-up.</div>
<footer>Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-footer="Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026" data-lang="en" data-theme="rzs6u4qwbvrcz50lxlfc6ejpu70ckybviel8vb74wwxo" lang="en" data-marpit-pagination="3" style="--paginate:true;--footer:Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026;--lang:en;--theme:rzs6u4qwbvrcz50lxlfc6ejpu70ckybviel8vb74wwxo;" data-marpit-pagination-total="16">
<div class="kicker">Why I changed models</div>
<h1 id="i-hit-my-limit-halfway-through-a-meeting">I hit my limit, halfway through a meeting</h1>
<div class="body">
<div class="cols">
  <div class="card soft">
    <div class="sub">Before · until May 2026</div>
    <h3>Claude (cloud)</h3>
    <ul>
      <li>Very capable</li>
      <li>Usage limit on my plan</li>
      <li>About €190 of top-ups in six weeks, more than my annual plan</li>
    </ul>
  </div>
  <div class="card good">
    <div class="sub">After · from May 2026</div>
    <h3>Qwen 3.6 (open model, on my desk)</h3>
    <ul>
      <li>Runs on a 16 GB gaming graphics card</li>
      <li>No limit, no bill</li>
      <li>Private: nothing leaves the house</li>
    </ul>
  </div>
</div>
<div class="pullquote" style="font-size:0.92em">Economics started the journey.<br />Drift is what I found along the way.</div>
</div>
<div class="inshort"><b>In short</b> I moved to a smaller, local AI to save money. Then it started to go wrong.</div>
<footer>Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-footer="Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026" data-lang="en" data-theme="rzs6u4qwbvrcz50lxlfc6ejpu70ckybviel8vb74wwxo" lang="en" data-marpit-pagination="4" style="--paginate:true;--footer:Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026;--lang:en;--theme:rzs6u4qwbvrcz50lxlfc6ejpu70ckybviel8vb74wwxo;" data-marpit-pagination-total="16">
<div class="kicker">Drift</div>
<h1 id="claude-hid-the-gaps-qwen-didnt">Claude <em>hid</em> the gaps. Qwen didn't.</h1>
<div class="body">
<div class="word"><em>drift</em> = the AI slowly goes off track, and does not notice</div>
<div class="cols three" style="margin-top:14px">
  <div class="card soft">
    <div class="sub">Run 1 · Claude Haiku and Sonnet</div>
    <ul class="checks">
      <li><span class="yes">✓</span><span class="t">One note, the right date, <b>5 of 5</b> quotes to the right person</span></li>
      <li><span class="no">✗</span><span class="t">Deleted the transcript <b>without asking</b></span></li>
      <li><span class="no">✗</span><span class="t">Haiku made up <b>6 due dates</b></span></li>
    </ul>
  </div>
  <div class="card bad">
    <div class="sub">Run 2 · Qwen, 4-bit, on my own computer</div>
    <ul class="checks">
      <li><span class="no">✗</span><span class="t">Wrote the note <b>before</b> it knew who was speaking</span></li>
      <li><span class="no">✗</span><span class="t">Named <b>4 of 4</b> speakers wrong. The CEO became “head of alliances”</span></li>
      <li><span class="no">✗</span><span class="t">Deleted the transcript <b>without asking</b></span></li>
    </ul>
  </div>
  <div class="card bad">
    <div class="sub">Run 3 · same Qwen, 8-bit, in the cloud</div>
    <ul class="checks">
      <li><span class="no">✗</span><span class="t"><b>Two</b> notes, and the <b>wrong date</b></span></li>
      <li><span class="no">✗</span><span class="t"><b>2 of 5</b> quotes to the wrong person</span></li>
      <li><span class="no">✗</span><span class="t">A Chinese word in an English sentence</span></li>
    </ul>
  </div>
</div>
<p style="font-size:0.64em;color:var(--muted);margin-top:10px">Same May workflow, same answers, one run each. Test meeting: “OKR Planning with GitLab Executive Team”, GitLab Unfiltered, public on YouTube. Claude is not the May model.</p>
</div>
<div class="inshort"><b>In short</b> Claude covered for a weak workflow. Qwen could not.</div>
<footer>Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-footer="Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026" data-lang="en" data-theme="rzs6u4qwbvrcz50lxlfc6ejpu70ckybviel8vb74wwxo" lang="en" data-marpit-pagination="5" style="--paginate:true;--footer:Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026;--lang:en;--theme:rzs6u4qwbvrcz50lxlfc6ejpu70ckybviel8vb74wwxo;" data-marpit-pagination-total="16">
<div class="kicker">My first fix: more words</div>
<h1 id="more-instructions-then-shouting">More instructions. Then <em>SHOUTING</em>.</h1>
<div class="body">
<div class="shift">
  <div></div>
  <div class="h">11 May<em>Before</em></div>
  <div class="h peak">8 Sep<em>First fix: more words</em></div>
  <div class="h now">Today<em>What worked: code</em></div>
  <div class="rl">Lines in the prompt<span>instructions to the AI</span></div>
  <div class="c"><b>73</b><i class="ink" style="width:17.5%"></i></div>
  <div class="c peak"><b>416</b><i class="ink" style="width:100%"></i></div>
  <div class="c now"><b>283</b><i class="ink" style="width:68%"></i></div>
  <div class="rl">Warnings in CAPITALS<span>MUST, NEVER, STOP…</span></div>
  <div class="c"><b>0</b></div>
  <div class="c peak"><b class="red">13</b><i class="red" style="width:100%"></i></div>
  <div class="c now"><b>0</b></div>
  <div class="rl">Scripts doing the sure things<span>normal code</span></div>
  <div class="c"><b>1</b><i class="blue" style="width:12.5%"></i></div>
  <div class="c peak"><b>4</b><i class="blue" style="width:50%"></i></div>
  <div class="c now"><b class="blue">8</b><i class="blue" style="width:100%"></i></div>
</div>
<div class="under">
<div class="terminal"><span class="who">Two real lines from the 8 September prompt</span>THIS IS THE ONLY SOURCE OF TRUTH FOR PROGRESS.<br />If preconditions fail → STOP. Report gate failure. <span class="x9">× 9</span></div>
<div class="pullquote under-quote">An instruction is only a suggestion.</div>
</div>
</div>
<div class="inshort"><b>In short</b> If you write MUST in capitals, your process is missing a check.</div>
<footer>Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-marpit-scope-POJTX5sa="" data-paginate="true" data-footer="Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026" data-lang="en" data-theme="rzs6u4qwbvrcz50lxlfc6ejpu70ckybviel8vb74wwxo" lang="en" data-marpit-pagination="6" style="--paginate:true;--footer:Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026;--lang:en;--theme:rzs6u4qwbvrcz50lxlfc6ejpu70ckybviel8vb74wwxo;" data-marpit-pagination-total="16"><div class="kicker">The turn</div>
<h1 id="my-whole-flow-split-three-ways">My whole flow, <em>split three ways</em></h1>
<div class="body">
<div class="flowmap">
<div class="hd"></div><div class="hd m">Model · thinks</div><div class="hd s">Scripts · do</div><div class="hd y">You · decide</div><div class="hd f">Files · remember</div>
<div class="st">Transcribe</div><div></div><div class="c s">Speech-to-text tools</div><div></div><div class="c f">transcript</div>
<div class="st">Name speakers</div><div class="c m">Proposes names</div><div class="c s">Applies them</div><div class="c rev">Confirm</div><div class="c f">speaker-map</div>
<div class="st">Add context</div><div></div><div class="c s">Calendar, date, people</div><div></div><div class="c f">context</div>
<div class="st">Summarise</div><div class="c m">Writes it</div><div></div><div class="c rev">Review</div><div class="c f">summary</div>
<div class="st">Read the tone</div><div class="c m">Chooses 1 of 4</div><div></div><div></div><div class="c f">sentiment</div>
<div class="st">Find actions</div><div class="c m">Finds who agreed to what</div><div class="c s">Checks for duplicates</div><div class="c rev">Review, with priorities</div><div class="c f">actions</div>
<div class="st">Set priorities</div><div class="c m">Chooses now / next / someday</div><div></div><div></div><div class="c f">actions</div>
<div class="st">Draft follow-up</div><div class="c m">Drafts the email</div><div></div><div class="c rev">Yes or no</div><div class="c f">draft</div>
<div class="st">File the note</div><div></div><div class="c s">Builds the note from the files</div><div></div><div class="c f">the note</div>
<div class="st">Clean up</div><div></div><div class="c s">Deletes working files</div><div class="c door">One-way door</div><div class="c f">approval log</div>
</div>
<p class="flowmap-note">Between every row, a script checks: is it this step’s turn, and did the last step leave its file? If not, stop.</p>
</div>
<div class="inshort"><b>In short</b> The model thinks. Scripts do. Files remember.</div>
<footer>Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-footer="Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026" data-lang="en" data-theme="rzs6u4qwbvrcz50lxlfc6ejpu70ckybviel8vb74wwxo" lang="en" data-marpit-pagination="7" style="--paginate:true;--footer:Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026;--lang:en;--theme:rzs6u4qwbvrcz50lxlfc6ejpu70ckybviel8vb74wwxo;" data-marpit-pagination-total="16">
<div class="kicker">Rule 1</div>
<h1 id="give-each-step-to-the-right-worker">Give each step to <em>the right worker</em></h1>
<div class="body">
<div class="sorter">
  <div class="col model">
    <div class="head">Model</div>
    <div class="q">Does this need judgement?</div>
    <div class="chips"><span class="chip">Who is speaking</span><span class="chip">Summary</span><span class="chip">Actions</span><span class="chip">Priorities</span><span class="chip">Tone of the meeting</span></div>
  </div>
  <div class="col script">
    <div class="head">Script</div>
    <div class="q">Is there only one right answer?</div>
    <div class="chips"><span class="chip miss">Date and time</span><span class="chip">File name and folder</span><span class="chip miss">Copy the transcript</span><span class="chip">Link to the project</span><span class="chip">Delete old files</span></div>
  </div>
</div>
<div class="evidence">
  <div class="fact"><div class="big">5,000 words</div><div class="small">In May, the model retyped the whole transcript. It ran out of space, and I paid for every word.</div></div>
  <div class="fact"><div class="big">Wrong date</div><div class="small">The date was already in the file name. Qwen still got it wrong, in Run 3.</div></div>
  <div class="fact green"><div class="big">1 → 8 scripts</div><div class="small">Today, scripts do the sure things. They get them right every time.</div></div>
</div>
</div>
<div class="inshort"><b>In short</b> If the answer never changes, don’t ask a model.</div>
<footer>Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-footer="Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026" data-lang="en" data-theme="rzs6u4qwbvrcz50lxlfc6ejpu70ckybviel8vb74wwxo" lang="en" data-marpit-pagination="8" style="--paginate:true;--footer:Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026;--lang:en;--theme:rzs6u4qwbvrcz50lxlfc6ejpu70ckybviel8vb74wwxo;" data-marpit-pagination-total="16">
<div class="kicker">Rule 2</div>
<h1 id="every-step-leaves-a-file">Every step leaves <em>a file</em></h1>
<div class="body">
<div class="flow chain">
  <div class="step">Map speakers</div><div class="arrow">→</div>
  <div class="step file">speaker-map.json</div><div class="arrow clr"><em>clear chat</em>→</div>
  <div class="step">Summarise</div><div class="arrow">→</div>
  <div class="step file">summary.json</div><div class="arrow clr"><em>clear chat</em>→</div>
  <div class="step">Find actions</div><div class="arrow">→</div>
  <div class="step file">actions.json</div><div class="arrow clr"><em>clear chat</em>→</div>
  <div class="step">Script files the note</div>
</div>
<div class="cols" style="margin-top:10px">
  <div class="card bad"><h3>A chat forgets</h3><p>It gets long. Early details get lost. You cannot check it.</p>
    <div class="stats"><div><b>4</b><span>auto-compactions</span></div><div><b>✗</b><span>did not finish</span></div></div>
    <p class="test"><b>My test, 64K context:</b> after each compaction, the model forgot work it had already finished.</p></div>
  <div class="card good"><h3>A file remembers</h3><p>The next step starts from the file, not the chat. A script can check it: <b>is it there? does it have the right shape?</b></p>
    <div class="stats"><div><b>0</b><span>auto-compactions</span></div><div><b>✓</b><span>finished every step</span></div></div>
    <p class="test"><b>Same model, same 64K:</b> I cleared the context after every step, on purpose. Each step started again from the files.</p></div>
</div>
</div>
<div class="inshort"><b>In short</b> Each step writes down its result, so you can clear the context between steps.</div>
<footer>Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-footer="Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026" data-lang="en" data-theme="rzs6u4qwbvrcz50lxlfc6ejpu70ckybviel8vb74wwxo" lang="en" data-marpit-pagination="9" style="--paginate:true;--footer:Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026;--lang:en;--theme:rzs6u4qwbvrcz50lxlfc6ejpu70ckybviel8vb74wwxo;" data-marpit-pagination-total="16">
<div class="kicker">Rule 3</div>
<h1 id="keep-progress-outside-the-model">Keep progress <em>outside</em> the model</h1>
<div class="body">
<div class="cols" style="grid-template-columns: 1fr 1.15fr; align-items:center">
<div>
<div class="statefile">
  <div class="tab"><span><span class="dot"></span>progress file</span><span>.process-state.json</span></div>
  <div class="fields">
    <div class="field active"><span class="key">current_step</span><span class="val">2.6</span></div>
    <div class="field"><span class="key">completed_steps</span><span class="val">-1, 0, 1, 2, 2.5, 2.6</span></div>
    <div class="field"><span class="key">speakers confirmed</span><span class="val">yes</span></div>
    <div class="field"><span class="key">aborted</span><span class="val">no</span></div>
  </div>
</div>
</div>
<div>
<div class="resume"><div class="seg" data-label="working"></div><div class="file" data-label="I quit">finding actions<br />half done</div><div class="gap"></div><div class="file" data-label="I reopen">reads<br />the file</div><div class="seg end" data-label="carries on"></div></div>
<p style="font-size:0.76em;margin-top:14px">In rehearsal I closed everything in the middle of finding actions. When I opened it again, it read this file and carried on. <b>Nothing repeated. Nothing lost.</b></p>
</div>
</div>
</div>
<div class="inshort"><b>In short</b> The model forgets everything. The file doesn’t.</div>
<footer>Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-footer="Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026" data-lang="en" data-theme="rzs6u4qwbvrcz50lxlfc6ejpu70ckybviel8vb74wwxo" lang="en" data-marpit-pagination="10" style="--paginate:true;--footer:Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026;--lang:en;--theme:rzs6u4qwbvrcz50lxlfc6ejpu70ckybviel8vb74wwxo;" data-marpit-pagination-total="16">
<div class="kicker">Rule 4</div>
<h1 id="check-before-and-after-every-step">Check <em>before</em> and <em>after</em> every step</h1>
<div class="body">
<div class="gatecheck">
  <div class="q"><b>Before</b>Is it this step’s turn?</div>
  <div class="arr">→</div>
  <div class="work">Do the step</div>
  <div class="arr">→</div>
  <div class="q"><b>After</b>Did it leave its file, in the right shape?</div>
</div>
<div class="stopline"><div class="stop">if no<br /><span>STOP</span></div><div></div><div></div><div></div><div class="stop">if no<br /><span>STOP</span></div></div>
<div class="caught-h">What it caught</div>
<div class="cols three">
  <div class="card soft caught">
    <div class="sub"><span class="tick">✓</span> Speakers</div>
    <p>The model still guessed <b>2 of 4</b> wrong. But it had to <b>stop and show me first</b>. One-line fix, before anything was written.</p>
  </div>
  <div class="card soft caught">
    <div class="sub"><span class="tick">✓</span> My own bug</div>
    <p>A time-zone bug looked for a <b>12:00</b> note. The meeting was at <b>10:00</b>. It <b>refused to file</b> instead of filing wrong.</p>
  </div>
  <div class="card soft caught">
    <div class="sub"><span class="tick">✓</span> A skipped review</div>
    <p>A review is done only <b>after I reply</b>. The model tried to <b>skip my actions review</b>. The check stopped it.</p>
  </div>
</div>
</div>
<div class="inshort"><b>In short</b> The check is a small script, not a sentence in the prompt. The model cannot talk it round.</div>
<footer>Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-footer="Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026" data-lang="en" data-theme="rzs6u4qwbvrcz50lxlfc6ejpu70ckybviel8vb74wwxo" lang="en" data-marpit-pagination="11" style="--paginate:true;--footer:Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026;--lang:en;--theme:rzs6u4qwbvrcz50lxlfc6ejpu70ckybviel8vb74wwxo;" data-marpit-pagination-total="16">
<div class="kicker">Rule 5</div>
<h1 id="mark-the-one-way-doors">Mark the <em>one-way doors</em></h1>
<div class="body">
<div class="cols" style="grid-template-columns: 0.9fr 1.3fr; align-items:start">
<div>
<div class="dialog">
  <div class="bar">One-way door · last step: clean up</div>
  <div class="msg">Delete the transcript, audio and progress file for this meeting. Approve?</div>
  <div class="btns"><span class="btn ok">Approve</span><span class="btn block">Block</span></div>
</div>
<p style="font-size:0.7em;margin-top:12px"><b>Only I can answer.</b> The model can’t see or click it. Every click is logged.</p>
<p style="font-size:0.7em;margin-top:8px"><b style="color:var(--structure)">Retests after Block: 3 of 3</b> stopped and asked.</p>
<p style="font-size:0.7em;margin-top:12px"><b>My test for who decides:</b> is it ambiguous, irreversible or sensitive?</p>
</div>
<div>
<div class="terminal"><span class="who">After I click Block · Pi → model</span><span class="gate">Amar blocked the clean-up step. Stop and ask what to change. This session can now only read files and run the pipeline scripts.</span></div>
<div class="card" style="margin-top:10px">
  <div class="sub">And the shell makes sure</div>
  <ul class="checks">
    <li><span class="no">✗</span><span class="t">Delete, move or copy files · edit in place</span></li>
    <li><span class="no">✗</span><span class="t">Run code it wrote itself · run any other script</span></li>
    <li><span class="no">✗</span><span class="t">Try the same door again</span></li>
    <li><span class="yes">✓</span><span class="t">Read files · run my pipeline scripts · ask me</span></li>
  </ul>
</div>
</div>
</div>
</div>
<div class="inshort"><b>In short</b> The instruction says stop. The shell makes sure.</div>
<footer>Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-footer="Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026" data-lang="en" data-theme="rzs6u4qwbvrcz50lxlfc6ejpu70ckybviel8vb74wwxo" lang="en" data-marpit-pagination="12" style="--paginate:true;--footer:Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026;--lang:en;--theme:rzs6u4qwbvrcz50lxlfc6ejpu70ckybviel8vb74wwxo;" data-marpit-pagination-total="16">
<div class="kicker">The result</div>
<h1 id="my-flow-in-may-vs-my-flow-today">My flow in May vs <em>my flow today</em></h1>
<div class="body">
<div class="score">
  <div class="h">Same meeting, model and answers</div><div class="h old">May</div><div class="h new">Today</div>
  <div class="lab">Checked the speakers before writing</div><div><span class="no">✗</span></div><div><span class="yes">✓</span></div>
  <div class="lab">Quotes given to the right person</div><div><span class="no">✗</span> 3 of 5</div><div><span class="yes">✓</span> 5 of 5</div>
  <div class="lab">One note per meeting</div><div><span class="no">✗</span> 2 notes</div><div><span class="yes">✓</span> 1 note</div>
  <div class="lab">Right date</div><div><span class="no">✗</span></div><div><span class="yes">✓</span></div>
  <div class="lab">Asked before deleting</div><div><span class="no">✗</span></div><div><span class="yes">✓</span></div>
  <div class="lab">Carried on after I quit</div><div><span class="na">–</span> not tested</div><div><span class="yes">✓</span></div>
</div>
<p style="font-size:0.66em;color:var(--muted);margin-top:10px">To be fair: today’s flow also has more steps and better scripts. This is not a lab test. It is my flow in May against my flow today.</p>
</div>
<div class="inshort"><b>In short</b> The old flow went wrong quietly. The new one goes wrong loudly, early, and where I can fix it.</div>
<footer>Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-footer="Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026" data-lang="en" data-theme="rzs6u4qwbvrcz50lxlfc6ejpu70ckybviel8vb74wwxo" lang="en" data-marpit-pagination="13" style="--paginate:true;--footer:Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026;--lang:en;--theme:rzs6u4qwbvrcz50lxlfc6ejpu70ckybviel8vb74wwxo;" data-marpit-pagination-total="16">
<div class="kicker">What this unlocks</div>
<h1 id="smaller-models-bigger-jobs">Smaller models, <em>bigger jobs</em></h1>
<div class="body">
<div class="cols three" style="align-items:stretch">
  <div class="card good">
    <div class="sub">Room to breathe</div>
    <p>A smaller model does the judgement. Scripts do the rest.</p>
    <p><b>No tokens spent on work with one right answer. Meetings stop using the capacity I need for everything else.</b></p>
  </div>
  <div class="card good">
    <div class="sub">Safer</div>
    <p>Every step leaves a file. Every Approve and Block is logged.</p>
    <p><b>You can show exactly what happened, and who said yes.</b></p>
  </div>
  <div class="card good">
    <div class="sub">Portable</div>
    <p>Swap the model without rewriting the flow.</p>
    <p><b>Less lock-in. Data can stay on your machine, if a model that fits clears the bar.</b></p>
  </div>
</div>
<div class="card bad" style="padding:8px 18px;margin-top:2px">
  <div class="sub">A smaller model. Not the smallest · one meeting, five models</div>
  <p style="font-size:0.66em;margin:0">One couldn’t read the steps. Same Qwen at <b>3-bit</b> invented a speaker who was in Vegas. At <b>8-bit</b> it got everyone right. <b>Architecture lowers the bar. It doesn’t remove it.</b></p>
</div>
<p style="font-size:0.62em;margin-top:10px"><b>The same shape fits:</b> sales call follow-ups · invoice processing · customer onboarding · hiring · month-end close</p>
</div>
<div class="inshort"><b>In short</b> Reliable flows let you use smaller models on bigger jobs.</div>
<footer>Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-footer="Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026" data-lang="en" data-theme="rzs6u4qwbvrcz50lxlfc6ejpu70ckybviel8vb74wwxo" lang="en" data-marpit-pagination="14" style="--paginate:true;--footer:Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026;--lang:en;--theme:rzs6u4qwbvrcz50lxlfc6ejpu70ckybviel8vb74wwxo;" data-marpit-pagination-total="16">
<div class="kicker">What’s next</div>
<h1 id="models-are-splitting-some-write-some-decide">Models are splitting: <em>some write, some decide</em></h1>
<div class="body">
<div class="cols" style="grid-template-columns: 1.9fr 1fr; align-items:stretch">
  <div class="card">
    <div class="sub">Split the model box in two</div>
    <div class="wd">
      <div class="box writer"><h4>Writer</h4><div class="jd">Judgement: what to say</div><div class="chips"><span class="chip">Summary</span><span class="chip">Actions</span><span class="chip">Follow-up draft</span></div><p>Writes text.</p></div>
      <div class="box decider"><h4>Decider</h4><div class="jd">Judgement: which option</div><div class="chips"><span class="chip">Sentiment</span><span class="chip">Priority</span><span class="chip">Project</span><span class="chip">Follow-up? yes / no</span><span class="chip">Speaker</span></div><p>Picks one answer from a list. A script checks it.</p></div>
    </div>
  </div>
  <div class="card good">
    <div class="sub">How sure is it?</div>
    <div class="dial"><div class="track"><div class="marker" style="left:78%"></div></div><div class="labels"><span>ask me</span><span>carry on</span></div></div>
    <p style="margin-top:8px">I am asked only when it is unsure. <b>The dial belongs to the decider and a script, never to the model doing the work.</b></p>
    <p style="color:var(--muted)">Not wired in yet.</p>
  </div>
</div>
<div class="market"><span class="lab">Why I don’t pick a winner · Jev Decision Index 0.3, 7 Oct</span>Three weeks after Jev’s early access opened, a community index ranked <b>112 deciders</b>. Jev came <b>third</b>.</div>
</div>
<div class="inshort"><b>In short</b> Whoever makes the best decider, it slots into one box. The flow stays the same.</div>
<footer>Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-footer="Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026" data-class="close" data-lang="en" data-theme="rzs6u4qwbvrcz50lxlfc6ejpu70ckybviel8vb74wwxo" lang="en" class="close" data-marpit-pagination="15" style="--paginate:true;--footer:Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026;--class:close;--lang:en;--theme:rzs6u4qwbvrcz50lxlfc6ejpu70ckybviel8vb74wwxo;" data-marpit-pagination-total="16"><div class="kicker">Take these home</div>
<h1 id="five-rules-start-with-a-checklist">Five rules. <em>Start with a checklist.</em></h1>
<div class="body">
<div class="rules">
  <div class="rule"><div class="num">1</div><div class="txt"><b>Write the steps down,</b> and give each one to the right worker. <span style="color:#8B94A1">Judgement → model. One right answer → script.</span></div></div>
  <div class="rule"><div class="num">2</div><div class="txt"><b>Make every step leave a file.</b> <span style="color:#8B94A1">The next step starts from the file, not the chat.</span></div></div>
  <div class="rule"><div class="num">3</div><div class="txt"><b>Keep progress outside the model.</b> <span style="color:#8B94A1">A note says which step you are on.</span></div></div>
  <div class="rule"><div class="num">4</div><div class="txt"><b>Check before and after every step.</b> <span style="color:#8B94A1">If the answer is no, stop.</span></div></div>
  <div class="rule"><div class="num">5</div><div class="txt"><b>Mark the one-way doors.</b> <span style="color:#8B94A1">A person decides what is ambiguous, irreversible or sensitive.</span></div></div>
</div>
<p style="font-size:0.8em;margin-top:10px"><b>Try one tonight:</b> take your messiest AI workflow. Write down the steps, and what each one should produce.</p>
</div>
<div class="inshort"><b>In short</b> Without code, you are the check. Add scripts where the answer never changes, and test them.</div>
<footer>Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-footer="Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026" data-class="close lead" data-lang="en" data-theme="rzs6u4qwbvrcz50lxlfc6ejpu70ckybviel8vb74wwxo" lang="en" class="close lead" style="--footer:Architecture Over Intelligence · The AI Fellowship Madrid · 9 Oct 2026;--class:close lead;--lang:en;--theme:rzs6u4qwbvrcz50lxlfc6ejpu70ckybviel8vb74wwxo;">
<h1 id="models-change-every-month">Models change every month.</h1>
