<style>
  :root {
    --paper:#F6F1E7; --ink:#231B12; --muted:#6E6255; --accent:#A63E12;
    --structure:#33544A; --hairline:#E4DAC6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Source Sans 3', system-ui, sans-serif; line-height: 1.5; }
  main { max-width: 760px; margin: 0 auto; padding: 88px 32px 120px; }
  h1 { font-family: 'Fraunces', Georgia, serif; font-weight: 700; font-size: 50px; letter-spacing: -0.01em; margin: 0 0 8px; }
  .byline { color: var(--muted); font-size: 18px; margin: 0; }
  .rule { width: 48px; height: 5px; background: var(--accent); margin: 28px 0 36px; border-radius: 2px; }
  .talk { border: 1px solid var(--hairline); border-radius: 12px; padding: 30px 32px; margin-bottom: 20px; }
  .talk h2 { margin: 0 0 6px; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 28px; }
  .talk h2 a { color: var(--structure); text-decoration: none; }
  .talk h2 a:hover { text-decoration: underline; }
  .talk .meta { font-family: 'IBM Plex Mono', monospace; color: var(--muted); font-size: 14px; }
  .talk p { margin: 14px 0 0; }
  .links { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 8px 24px; font-weight: 600; }
  .links a { color: var(--accent); text-decoration: none; }
  .links a:hover { text-decoration: underline; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 2px; }
  ::selection { background: #F3E1D2; color: var(--ink); }
  footer { color: var(--muted); font-size: 14px; margin-top: 48px; }
  footer a { color: var(--structure); }
  @media (max-width: 600px) {
    main { padding: 48px 16px 80px; }
    h1 { font-size: 40px; }
    .talk { padding: 22px 20px; }
    .talk h2 { font-size: 24px; }
  }
</style>
</head>
<body>
<main>
  <h1>Talks</h1>
  <p class="byline">Amar Patel</p>
  <div class="rule"></div>

  <article class="talk">
    <h2><a href="./architecture-over-intelligence/">Architecture Over Intelligence</a></h2>
    <div class="meta">The AI Fellowship Madrid · 9 October 2026 · 15 min</div>
    <p>Designing reliable AI workflows: why a JSON file, structural gates and a human at the decision are worth more than a bigger model.</p>
    <div class="links">
      <a href="./architecture-over-intelligence/">Open the deck →</a>
      <a href="./architecture-over-intelligence/architecture-over-intelligence.pdf">Download PDF</a>
    </div>
  </article>

  <footer><a href="https://www.linkedin.com/in/amarapatel/">LinkedIn</a></footer>
</main>
